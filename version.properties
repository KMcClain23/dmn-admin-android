# THE PLAY CONSOLE IS THE AUTHORITATIVE FLOOR. THIS FILE ONLY MIRRORS IT.
#
# ── THE CORRECTION, RECORDED WHERE THE MISTAKE WAS MADE ─────────────────────
#
# This file was read as a publication record and it is not one. It said 43 went
# to Firebase and said nothing about Play, and that silence was taken as "the
# app has never been on Play" — the app was in fact installed from Play
# internal testing all along.
#
# A PLAY UPLOAD LEAVES NO TRACE IN THIS REPO. So this file can never be evidence
# of what Play holds: its silence is not a negative result, only an absence of
# information. Before publishing, read the versionCode on the track in the Play
# Console and treat THAT as the floor. Update the number below to match after an
# upload, so the mirror stays close — but if the two ever disagree, the Console
# is right and this file is stale.
#
# THE LAST versionCode ACTUALLY PUBLISHED. Checked in on purpose.
#
# versionCode is derived from `git rev-list --count HEAD`, which is monotonic
# only as long as history is append-only. A rebase, a squash, or a branch that
# drops commits all REDUCE that count — and Play rejects a duplicate or lower
# versionCode permanently. There is no undo and no reuse: a burned number is
# burned for the life of the app.
#
# So the derived number is not trusted on its own. The publish tasks compare it
# against this floor and refuse to run unless it is strictly greater. A monotonic
# sequence you cannot verify is not monotonic.
#
# HOW TO UPDATE: after a build is genuinely published to Play or to Firebase,
# set this to the versionCode that went out, and commit it in the same change.
# Do not raise it to make a failing publish pass — that is the guard working.
lastPublishedVersionCode=54

# What the last published code was, in human terms, so a mistake is visible
# rather than arithmetic. Free text; nothing parses it.
# Confirmed in the Play Console on 2026-08-31: internal testing holds 43
# (0.1.0), rolled out 100% on 2026-08-29. The mobile Console view shows the
# ACTIVE release rather than every bundle ever uploaded, so a discarded 44-46
# cannot be ruled out — which does not matter here, because the build being
# published is above all of them and nothing >= 47 can exist while 43 is active.
lastPublishedNote=54 (0.3.0) is live on Play. Read back from inside the shipped bundle rather than from notes: app-release.aab, 18,138,730 bytes, base/manifest/AndroidManifest.xml says versionCode 54, versionName 0.3.0, package com.dmnarration.admin. Supersedes 49 (0.2.0) and 43 (0.1.0). NOTE: this value does NOT drive the in-app update prompt — that uses Play's App Update API, which asks Play what is on the track. This is the publish guard's floor and nothing else.
