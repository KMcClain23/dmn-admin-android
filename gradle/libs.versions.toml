# Every version resolved against the registry on 25 August 2026, not carried over
# from memory. Pinned explicitly rather than left to a range so a build a year
# from now produces the same artefacts as this one.
#
# The androidx versions are deliberately one wave behind the newest published.
# Compose 1.12, core 1.19, lifecycle 2.11 and hilt-navigation 1.4 all declare
# that consumers must compile against API 37, and API 37 is not a downloadable
# platform yet — `android sdk install "platforms;android-37"` answers "not
# found". The newest *installable* platform is 36, so this is the newest wave
# that actually builds. Move all five forward together once 37 ships.
[versions]
agp = "9.3.2"
kotlin = "2.4.10"
ksp = "2.3.11"
hilt = "2.60.1"

# Compose BOM governs every androidx.compose artefact — none of them carry their
# own version below, on purpose.
composeBom = "2026.06.01"
activityCompose = "1.12.4"
coreKtx = "1.18.0"
lifecycle = "2.10.0"
navigationCompose = "2.9.8"
hiltNavigationCompose = "1.3.0"

# supabase-kt is likewise a BOM: auth-kt and postgrest-kt must move together,
# and the Ktor version below has to be one that BOM was built against.
supabase = "3.7.0"
ktor = "3.5.2"

coil = "3.5.0"
kotlinxDatetime = "0.8.0"
kotlinxSerializationJson = "1.11.0"
datastorePreferences = "1.2.1"
securityCrypto = "1.1.0"

junit = "4.13.2"
androidxTestExt = "1.3.0"
espresso = "3.7.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

supabase-bom = { group = "io.github.jan-tennert.supabase", name = "bom", version.ref = "supabase" }
supabase-auth = { group = "io.github.jan-tennert.supabase", name = "auth-kt" }
supabase-postgrest = { group = "io.github.jan-tennert.supabase", name = "postgrest-kt" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }

coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinxDatetime" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastorePreferences" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExt" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# org.jetbrains.kotlin.android is intentionally absent: AGP 9 applies KGP
# itself and applying the plugin is now a hard error.
# Since Kotlin 2.0 the Compose compiler ships as a Kotlin plugin and is versioned
# with Kotlin itself — there is no separate compose-compiler version to track.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
